[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devsecops-secure-pipeline"
version = "1.0.0"
description = "FastAPI Task API demonstrating a security-focused CI/CD pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.161.0",
  "uvicorn[standard]==0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.bandit]
exclude_dirs = ["tests"]
skips = []

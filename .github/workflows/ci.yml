name: CI and Security

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-code-scan:
    name: Tests and Python security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install project
        run: python -m pip install -e .

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Bandit static analysis
        run: bandit -c pyproject.toml -r app -ll

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  container-scan:
    name: Build and scan container
    runs-on: ubuntu-latest
    needs: test-and-code-scan
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Docker image
        run: |
          docker build \
            -t devsecops-secure-pipeline:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/devsecops-secure-pipeline:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devsecops-secure-pipeline:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

      - name: Generate SBOM
        uses: anchore/sbom-action@d94f46e13c6c62f59525ac9a1e147a99dc0b9bf5 # v0.17.0
        with:
          image: devsecops-secure-pipeline:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-${{ github.sha }}.spdx.json

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/devsecops-secure-pipeline:${{ github.sha }}
          docker tag ghcr.io/${{ github.repository_owner }}/devsecops-secure-pipeline:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/devsecops-secure-pipeline:latest
          docker push ghcr.io/${{ github.repository_owner }}/devsecops-secure-pipeline:latest

      - name: Install Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign published image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: "1"
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/devsecops-secure-pipeline:${{ github.sha }}
        run: cosign sign --yes "$IMAGE_REF"
